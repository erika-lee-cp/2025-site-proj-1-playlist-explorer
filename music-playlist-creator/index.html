<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        Music Playlist Explorer
    </header>

    <main> 
        <!-- Modal Structure -->
        <div id="playlist-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>

                <div>
                    <img id="playlist-cover-img" src="assets/img/playlist.png" alt="cover art">
                    <div id="playlist-info-container">
                        <h1 id="playlist-title">Playlist Title</h1>
                        <div id="playlist-creator">Creator Name</div>    
                    </div>
                </div>
                <div class="songs-container">
                </div>           
            </div>
        </div>

        <!-- Your main content here -->
        <div class="playlist-cards">
        </div>                                           
    </main>

    <footer>
        <!-- Your footer content here -->
    </footer>
    <script src="script.js"></script>
</body>
</html>
